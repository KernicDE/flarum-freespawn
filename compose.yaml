services:
  mariadb:
    # Achtung: Die Datenbank wurde am 19.09.2026 auf MariaDB 12 aktualisiert (Datenverzeichnis
    # 12.3.3). Ein Downgrade auf 11 startet nicht mehr.
    image: mariadb:12-ubi10
    container_name: flarum-mariadb-freespawn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MARIADB_DATABASE=flarum
      - MARIADB_USER=flarum
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/3306'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: flarum-redis-freespawn
    restart: unless-stopped
    env_file:
      - .env
    # volatile-lru: raeumt nur Schluessel mit Ablaufzeit (Cache, Sessions) auf, Queue-Jobs bleiben erhalten
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec"]
    volumes:
      - redis-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  flarum:
    # Image kommt aus GHCR (Build per GitHub Actions bei Push auf main, siehe README)
    image: ghcr.io/kernicde/freespawn-flarum:latest
    container_name: flarum-app-freespawn
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/flarum:/var/www/html
    networks:
      - default
      - freespawn-net
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler (Queue-Housekeeping, GDPR, Umfragen) jede Minute
  scheduler:
    image: ghcr.io/kernicde/freespawn-flarum:latest
    container_name: flarum-scheduler-freespawn
    restart: unless-stopped
    user: www-data
    env_file:
      - .env
    command: ["sh", "-c", "while true; do php flarum schedule:run; sleep 60; done"]
    volumes:
      - ./data/flarum:/var/www/html
    networks:
      - default
    depends_on:
      flarum:
        condition: service_started

  # Queue-Worker (Redis). --max-time: beendet sich stuendlich und startet frisch (neuer Code nach Deploys)
  worker:
    image: ghcr.io/kernicde/freespawn-flarum:latest
    container_name: flarum-worker-freespawn
    restart: unless-stopped
    user: www-data
    env_file:
      - .env
    command: ["php", "flarum", "queue:work", "--queue=notifications,default,exports", "--max-time=3600", "--sleep=3"]
    volumes:
      - ./data/flarum:/var/www/html
    networks:
      - default
    depends_on:
      flarum:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: flarum-nginx-freespawn
    restart: unless-stopped
    volumes:
      - ./data/flarum:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - proxy
      - freespawn-net
    depends_on:
      - flarum
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Haupt-Domain freespawn.de
      - "traefik.http.routers.freespawn.rule=Host(`freespawn.de`)"
      - "traefik.http.routers.freespawn.entrypoints=websecure"
      - "traefik.http.routers.freespawn.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freespawn.service=freespawn-flarum"
      - "traefik.http.services.freespawn-flarum.loadbalancer.server.port=80"
      - "traefik.http.services.freespawn-flarum.loadbalancer.server.scheme=http"
      # www.freespawn.de -> freespawn.de (HTTPS und HTTP)
      - "traefik.http.routers.freespawn-www.rule=Host(`www.freespawn.de`)"
      - "traefik.http.routers.freespawn-www.entrypoints=websecure"
      - "traefik.http.routers.freespawn-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freespawn-www.middlewares=freespawn-www-redirect"
      - "traefik.http.routers.freespawn-www.service=freespawn-flarum"
      - "traefik.http.middlewares.freespawn-www-redirect.redirectregex.regex=^https?://www\\.(.*)"
      - "traefik.http.middlewares.freespawn-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.freespawn-www-redirect.redirectregex.permanent=true"
      # HTTP -> HTTPS
      - "traefik.http.routers.freespawn-http.rule=Host(`freespawn.de`) || Host(`www.freespawn.de`)"
      - "traefik.http.routers.freespawn-http.entrypoints=web"
      - "traefik.http.routers.freespawn-http.middlewares=freespawn-https"
      - "traefik.http.middlewares.freespawn-https.redirectscheme.scheme=https"

networks:
  default:
    name: flarum-freespawn-net
  proxy:
    external: true
  freespawn-net:
    external: true

volumes:
  redis-data:
    name: flarum-redis-freespawn-data
